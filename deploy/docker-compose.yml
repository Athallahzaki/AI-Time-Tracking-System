# =============================================================================
# AI Time Tracking System — main compose
#
# Jalankan dari folder deploy/:
#   cp .env.example .env          # sekali, lalu sesuaikan
#   docker compose up -d --build                      # frontend + backend
#   docker compose --profile mediamtx up -d --build   # + relay CCTV MediaMTX
#   docker compose --profile demo up -d --build       # + fake engine (tanpa GPU)
#
# Semua build memakai context = root repo (..), tetapi seluruh berkas
# deployment (Dockerfile, ignore file, nginx conf) tinggal di deploy/.
#
# Topologi:
#   browser ──:80──> frontend (nginx) ──/api──> backend:8000 ──TCP──> engine:8765
#                                    ├─/hls──> mediamtx:8888
#                                    └─/whep─> mediamtx:8889   (media: UDP 8189)
#
# Engine asli (D-FINE, GPU) TIDAK ada di compose ini: ia jalan di host dan
# backend menjangkaunya lewat host.docker.internal. Lihat deploy/README.md.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-ai-time-tracking}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # Backend FastAPI
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    image: ${IMAGE_PREFIX:-ai-time-tracking}/backend:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-ai-time-tracking}-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      # Engine (TCP NDJSON). Default: engine asli di host.
      # Profile demo -> set ENGINE_HOST=fake-engine di .env.
      ENGINE_HOST: ${ENGINE_HOST:-host.docker.internal}
      ENGINE_PORT: ${ENGINE_PORT:-8765}
      ENGINE_RECONNECT_SECONDS: ${ENGINE_RECONNECT_SECONDS:-2}
      # Path DI DALAM container. Folder backend/configs di-mount read-only,
      # jadi ganti file/isi kamera cukup edit lalu restart, tanpa rebuild.
      CAMERAS_CONFIG: /app/backend/configs/${CAMERAS_CONFIG_FILE:-cameras.yaml}
      POLICY_CONFIG: /app/backend/configs/${POLICY_CONFIG_FILE:-policy.yaml}
      BACKEND_DB_PATH: /data/backend.db
      DETECTION_RETENTION_DAYS: ${DETECTION_RETENTION_DAYS:-7}
      BACKEND_API_KEY: ${BACKEND_API_KEY:-}
    volumes:
      - backend-data:/data
      - ${BACKEND_CONFIG_DIR:-../backend/configs}:/app/backend/configs:ro
    extra_hosts:
      # Linux butuh ini agar host.docker.internal ada; Docker Desktop sudah punya.
      - "host.docker.internal:host-gateway"
    # Hanya untuk debugging lokal. Akses normal lewat nginx (/api).
    # Jangan diubah ke 0.0.0.0: port ini melewati injeksi X-API-Key nginx.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks: [app]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Frontend (Vue build) + reverse proxy nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/detections/stream}
    image: ${IMAGE_PREFIX:-ai-time-tracking}/frontend:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-ai-time-tracking}-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      BACKEND_UPSTREAM: http://backend:8000
      MEDIAMTX_HLS_UPSTREAM: ${MEDIAMTX_HLS_UPSTREAM:-http://mediamtx:8888}
      MEDIAMTX_WHEP_UPSTREAM: ${MEDIAMTX_WHEP_UPSTREAM:-http://mediamtx:8889}
      BACKEND_API_KEY: ${BACKEND_API_KEY:-}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-25m}
    volumes:
      - ${VIDEOS_DIR:-../frontend/public/videos}:/usr/share/nginx/html/videos:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    networks: [app]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # MediaMTX — relay CCTV (profile: mediamtx)
  # ---------------------------------------------------------------------------
  mediamtx:
    profiles: ["mediamtx"]
    image: bluenviron/mediamtx:${MEDIAMTX_VERSION:-1.21.1}
    container_name: ${COMPOSE_PROJECT_NAME:-ai-time-tracking}-mediamtx
    restart: unless-stopped
    environment:
      # Default `publisher` hanya agar compose valid saat profile ini mati.
      # Saat dipakai, WAJIB diisi RTSP CCTV di .env.
      MTX_PATHS_CAM01_SOURCE: ${CAM01_SOURCE:-publisher}
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS:-127.0.0.1}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # RTSP untuk engine di host (rtsp://127.0.0.1:8554/cam01).
      - "${MEDIAMTX_RTSP_BIND:-127.0.0.1}:8554:8554/tcp"
      # HLS/WHEP tidak dipublish: browser lewat nginx (/hls, /whep).
      # Media WebRTC tetap harus langsung ke UDP 8189.
      - "8189:8189/udp"
      - "127.0.0.1:9997:9997/tcp"
    networks: [app]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Fake engine — skenario protokol tanpa GPU (profile: demo)
  # ---------------------------------------------------------------------------
  fake-engine:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: deploy/fake-engine/Dockerfile
    image: ${IMAGE_PREFIX:-ai-time-tracking}/fake-engine:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-ai-time-tracking}-fake-engine
    restart: unless-stopped
    environment:
      FAKE_SCENARIO: ${FAKE_SCENARIO:-happy-path}
      FAKE_SPEED: ${FAKE_SPEED:-1}
      FAKE_LISTEN: 0.0.0.0:8765
    networks: [app]
    logging: *default-logging

networks:
  app:
    name: ${COMPOSE_PROJECT_NAME:-ai-time-tracking}-net

volumes:
  backend-data:
    name: ${COMPOSE_PROJECT_NAME:-ai-time-tracking}-backend-data
