services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    container_name: ai-time-mediamtx
    restart: unless-stopped
    environment:
      MTX_PATHS_CAM01_SOURCE: "${CAM01_SOURCE:?Isi CAM01_SOURCE di deploy/mediamtx/.env.mediamtx}"
      # Daftar dipisahkan koma. Isi IP LAN server jika dashboard dibuka dari PC lain.
      MTX_WEBRTCADDITIONALHOSTS: "${MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS:-127.0.0.1}"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554/tcp"
      - "8888:8888/tcp"
      - "8889:8889/tcp"
      - "8189:8189/udp"
      # Control API hanya dapat diakses dari mesin lokal.
      - "127.0.0.1:9997:9997/tcp"

