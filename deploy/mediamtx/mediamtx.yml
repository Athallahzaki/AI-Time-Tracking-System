# MediaMTX v1.21.1 — relay CCTV untuk engine (RTSP) dan browser (WHEP/HLS).
# Nilai source cam01 dioverride oleh MTX_PATHS_CAM01_SOURCE dari Docker Compose.
logLevel: info
logDestinations: [stdout]

api: true
apiAddress: :9997

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]

rtmp: false
srt: false
moq: false

hls: true
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: true
webrtcAddress: :50001
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :50002
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: ["100.101.175.190", "stream.zenahost.my.id"]

pathDefaults:
  sourceOnDemand: false

paths:
  cam01:
    # Aman sebagai default; Compose wajib menggantinya dengan CAM01_SOURCE.
    source: publisher
  # cam02..cam05: uji 5 kamera dengan video (publish_test_video.ps1 -Count 5).
  # Tanpa path terdaftar, publish ditolak "400 Bad Request" (eb-r1). Untuk CCTV
  # sungguhan ganti `source` dengan URL RTSP kamera masing-masing.
  cam02:
    source: publisher
  cam03:
    source: publisher
  cam04:
    source: publisher
  cam05:
    source: publisher

