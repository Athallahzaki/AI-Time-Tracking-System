# MediaMTX v1.21.1 — relay CCTV untuk engine (RTSP) dan browser (WHEP/HLS).
# Nilai source cam01 dioverride oleh MTX_PATHS_CAM01_SOURCE dari Docker Compose.
logLevel: info
logDestinations: [stdout]

api: true
apiAddress: :9997

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]

rtmp: false
srt: false
moq: false

hls: true
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: ["100.101.59.153"]

pathDefaults:
  sourceOnDemand: false

paths:
  cam01:
     source: publisher
#    source: rtsp://admin:admin123@192.168.1.108:554/cam/realmonitor?channel=1&subtype=0
#    rtspTransport: tcp
#  cam01b:
#    source: rtsp://admin:admin123@192.168.1.108:554/cam/realmonitor?channel=1&subtype=1
#    rtspTransport: tcp
  cam02:
    source: publisher
  cam03:
    source: publisher
  cam04:
    source: publisher
  cam05:
    source: publisher

