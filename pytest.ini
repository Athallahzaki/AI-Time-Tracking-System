[pytest]
# Tes kontrak dan engine palsu tinggal di contracts/tests karena keduanya
# menguji BATAS, bukan isi salah satu jalur. engine/tests punya tes engine
# sendiri dan dijalankan bersamaan.
testpaths = contracts/tests engine/tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:engine.*
