name: engine

on:
  push:
    paths: ["engine/**", "contracts/**", ".github/workflows/engine-b0.yml"]
  pull_request:
    paths: ["engine/**", "contracts/**", ".github/workflows/engine-b0.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately does NOT install torch, libreyolo or ultralytics. If the
      # mock path ever starts needing them, CI breaks here — which is the point:
      # B1's benchmark has to be runnable without a GPU or model weights.
      - name: Install (mock path only)
        run: pip install numpy "opencv-python-headless>=4.8" "PyYAML>=6.0" pytest

      - name: No company policy in engine/
        run: python contracts/tools/policy_grep.py engine/

      - name: Unit tests
        run: pytest engine/tests -q

      - name: Pipeline smoke run
        run: python -m engine.tools.run --mock --frames 30 --quiet
