name: backend

# Melengkapi `engine.yml` dan `contracts.yml`: sebelum ini tidak ada workflow yang
# menjalankan backend/tests, jadi `test_boundary.py` tidak pernah menggagalkan build.
on:
  push:
    paths: ["backend/**", "contracts/**", "engine/**", "pytest.ini", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "contracts/**", "engine/**", "pytest.ini", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # numpy + opencv: test_engine_channel.py menyambung ke engine sungguhan (jalur mock).
      - name: Install
        run: >-
          pip install -r backend/requirements.txt "pytest>=8,<9" "httpx>=0.27,<1"
          numpy "opencv-python-headless>=4.8"

      - name: Tes backend
        run: pytest backend/tests -q
