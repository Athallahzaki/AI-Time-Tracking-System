# Engine configuration.
#
# Perceptual constants only. No break allowance, no working hours, no warning
# thresholds — those are company policy and live in backend/policy/.
# ARCHITECTURE.md §16, enforced by contracts/tools/policy_grep.py.
#
# Every temporal value is in SECONDS. Conversion to frames happens at
# construction time using the effective fps (engine/config/schema.py).

core:
  source_uri: "samples/room.mp4"   # "0" for webcam, "rtsp://..." for a camera, or a file path
  source_type: "video_file"        # opencv | video_file | mock
  detection_interval: 1            # 1 is the only safe value until ARCHITECTURE.md §9 item 7 is fixed
  target_fps: 30.0                 # baseline value. Dropping to 10 is step 10, measured separately
  auto_warmup: true
  strict_mode: true                # fail loudly rather than degrade silently

detector:
  model_path: "LibreDFINEs.pt"     # D-FINE small via LibreYOLO (MIT)
  confidence_threshold: 0.50
  iou_threshold: 0.45
  image_size: 640
  device: "auto"                   # "auto" | "cpu" | "cuda" | 0
  half: false                      # FP16 is a trap on Pascal (GTX 1060). ARCHITECTURE.md §8

tracker:
  backend: "bytetrack"             # bytetrack | iou. Under strict_mode, a requested
                                   # backend that cannot be loaded is a startup failure,
                                   # not a silent fallback.
  track_threshold: 0.45
  match_threshold: 0.8
  track_buffer_seconds: 1.0        # was track_buffer=30 frames hardcoded at 30 fps
