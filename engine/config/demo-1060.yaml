# Profil DEMO di laptop GTX 1060 Max-Q (Pascal, 6 GB), 1 kamera lewat MediaMTX,
# rekognisi wajah menyala. Salinan dfine-m-face.yaml; yang berbeda hanya
# core.target_fps dan blok detector. Dasar angka (batch_check 4 Okt, video
# 848x478): M eager 70-75 ms, M graph 70,9 ms (tidak membantu); S eager 55-59
# ms, S graph 48,1 ms (1,17x, hasil identik). Lihat docs/DEMO-1060.md.
#
# Sengaja TIDAK memuat detector.swscale_resize: loader menolak kunci yang tidak
# dikenal, dan kunci itu baru ada sejak kumulatif v14. Dengan begini profil ini
# jalan di v13 maupun v14.
#
# Engine configuration.
#
# Perceptual constants only: how long before a track counts as gone, how much
# evidence confirms an identity, what similarity counts as a match. Office rules
# live in backend/policy/ and measurement thresholds in bench/.
# ARCHITECTURE.md §16. The loader accepts only the sections and keys the schema
# declares, so anything else here is a load-time error, not a silent default.
#
# Every temporal value is in SECONDS. Conversion to frames happens at
# construction time using the effective fps (engine/config/schema.py).

# How frames get in, and on what timeline (ARCHITECTURE.md §5.5, §6.6).
ingest:
  backend: "pyav"            # "pyav" | "opencv". opencv exists only so B4 can
                             # measure the swap instead of asserting it was free;
                             # it leaves once that delta is committed.
  rtsp_transport: "tcp"      # UDP loses packets and hands back corrupted frames
                             # that damage an embedding without raising anything
  timeout_seconds: 8.0       # a dead camera must not hang a thread for ever
  reconnect_attempts: 10     # files never reconnect (pyav_source._reconnect), so
                             # this only matters for RTSP — where 0 meant one
                             # dropped second killed the camera for good.
  reconnect_backoff_seconds: 1.0
  max_reconnect_backoff_seconds: 30.0
  measure_timeline_fidelity: true   # compare real PTS against frame_index / fps
  decoder_thread_type: "AUTO"       # AUTO | SLICE | FRAME | NONE. Set NONE to
                                    # measure what single-threaded decode costs.
  decoder_threads: 0                # 0 = one per core
  colour_conversion: "to_ndarray"   # "to_ndarray" | "reformatter". Identical
                                    # pixels; the second reuses one libswscale
                                    # context instead of building one per frame.
                                    # probe_ingest times both — switch only with
                                    # that number in the commit message.
  live_buffer: "latest"             # network streams only (files ignore it). A
                                    # reader thread drains RTSP at camera rate and
                                    # keeps the newest frame, so a slow pipeline
                                    # skips whole frames instead of making MediaMTX
                                    # discard packets ("reader is too slow").
  offset_correction: "slew"         # "slew" | "none". Hanya aktif dengan live_buffer:
                                    # latest: bias offset jam (keyframe lama dari
                                    # MediaMTX) dikoreksi maks 0,1 dtk/dtk (P18).
  hwaccel: "none"                   # "none" | "cuda" (NVDEC). Frame tetap disalin
                                    # balik ke RAM; hemat CPU decode, bukan PCIe.

core:
  source_uri: "samples/room.mp4"   # "0" for webcam, "rtsp://..." for a camera, or a file path
  source_type: "video_file"        # opencv | video_file | mock
  detection_interval: 1            # 1 is the only safe value until ARCHITECTURE.md §9 item 7 is fixed
  target_fps: 8.0                  # DEMO 1060: bukan 12. Detector S 48 ms + rekognisi ±34 ms/wajah
                                   # + CPU laptop yang throttle (1,5-2,5 GHz). 8 fps stabil lebih
                                   # baik daripada 12 yang naik-turun. Naikkan ke 10 hanya bila
                                   # gladi resik (lag_probe) menunjukkan sisa waktu.
  auto_warmup: true
  strict_mode: true                # fail loudly rather than degrade silently
  cpu_threads: 0                   # batas thread torch/OpenCV/BLAS. 0 = semua core
                                   # (lama). Uji 2 untuk dugaan rebutan thread
                                   # di live_buffer: latest (runtime/threads.py).

# Zones (B5, ARCHITECTURE.md §3.2, §4.2). The door, per camera, normalized 0-1.
#
# At runtime this arrives from the backend in `set_cameras` and the wire wins —
# a camera can be moved without editing a file, and two answers to "where is the
# door" would eventually disagree about whether somebody left the room. What this
# section is for is the single-camera developer run and the benchmark, where
# there is no backend to ask, and where §13.8's cheap false-gap estimate is
# defined in terms of this region.
#
# Normalized because the engine sees the mainstream while whoever draws the
# region is looking at the dashboard's substream (§6.7.2). A camera with no
# region never reports `door` — it reports `interior` or `frame_edge` — because
# guessing `door` silently marks every gap as a real departure.
zones:
  door_regions: {}                 # e.g.  cam0: [0.62, 0.10, 0.95, 0.55]
  edge_margin: 0.03                # how close to the frame edge counts as leaving
                                   # the view for a geometric reason

# The recognition queue (B5, §3.2, §5.2). Ordering only: a track born in the
# door region is tried first, because that is the one moment a frontal face is
# nearly guaranteed on a corner camera.
#
# OFF by default, and that is a measurement decision, not caution: B1's
# committed baseline was measured with no queue in the loop. Turning one on by
# default would move the numbers every later step is compared against, in the
# same commit that introduced the thing being compared (§16).
#
# Every value below left unset means "use the constant in
# identity/admission.py", so none of them has two homes.
recognition:
  # Rekognisi menyala untuk demo. Roster diisi lewat enrollment web (backend).
  # Tombol mundur bila identifikasi aneh: execution: "sync".
  enabled: true
  max_requests_per_frame: 2
  execution: "async"
  worker_queue: 8
  recognizer: "onnx_face"
  face_detector_model: "engine/models/recognition/scrfd_10g_bnkps.onnx"   # relatif ke folder tempat engine dijalankan
  face_embedder_model: "engine/models/embedder/glintr100.onnx"
  embedding_version: "auraface-v1"
  reference_db_path: "engine/data/references.sqlite3"
  onnx_providers: ["CUDAExecutionProvider", "CPUExecutionProvider"]
  onnx_gpu_mem_limit_mb: null     # batas VRAM ORT per sesi, mis. 1024 di 4060 8 GB dengan 5 kamera
  face_detection_threshold: 0.5
  face_detector_input_size: 640
  min_face_px: 40

# ReID berjangkar wajah (paket ea-r3, dokumen 12 §3.6, dokumen 04 §11). MATI secara
# default: tidak ada model yang dimuat dan tidak ada event yang berubah. Menyalakannya:
#   1. salin ONNX hasil tools/reid_train/export_onnx.py ke model_path (TIDAK di-commit);
#   2. isi model_sha256 dari MODEL-CARD (salah = engine menolak start);
#   3. match_threshold: null = usulan 0,80 yang BELUM dikalibrasi (masih ditahan sampai
#      ada crop berlabel dari kamera lokasi); isi dari MODEL-CARD setelah EA setuju;
#   4. enabled: true. Butuh recognition.recognizer onnx_face (galeri diisi dari wajah).
# Model hilang/rusak/SHA salah atau CUDA diminta tapi jatuh ke CPU = engine menolak start.
reid:
  enabled: false
  model_path: "engine/models/reid/osnet_reid.onnx"
  model_sha256: null
  match_threshold: null           # ditahan: belum ada kalibrasi di kamera lokasi
  min_crop_height_px: 96          # crop badan lebih pendek tidak di-embed
  embed_interval_seconds: 15      # per track; plus saat track baru & wajah baru terkonfirmasi
  max_batch: 8
  onnx_providers: ["CUDAExecutionProvider", "CPUExecutionProvider"]
  onnx_gpu_mem_limit_mb: 512       # 1060 6 GB: VRAM dibagi D-FINE + SCRFD + AuraFace
  # Waktu tempuh minimum antar lokasi (detik, simetris). Pasangan yang tidak ditulis
  # memakai default_travel_time_seconds yang sengaja ketat. Isi setelah diukur di lokasi.
  travel_time_seconds: {}
  default_travel_time_seconds: 30
  # Jam lokal galeri tubuh + kelompok ANON dikosongkan tiap hari (terjadwal, walau kamera
  # sepi). Pilih jam di luar jam operasional.
  daily_purge_time: "00:00"

detector:
  model_path: "LibreDFINEs.pt"   # DEMO 1060: S. M 70-75 ms, S 48 ms dengan cuda_graph.
  confidence_threshold: 0.50
  iou_threshold: 0.45
  image_size: 640
  device: "auto"
  half: false                    # WAJIB false di Pascal: FP16 lebih lambat, tanpa tensor core.
  pre_resize: true               # tidak aktif pada video < 640 di salah satu sisi (848x478); aman.
  cudnn_benchmark: false
  cuda_graph: true               # S: 56 -> 48 ms, identik. Bila aneh saat gladi: false (hilang ±7 ms).
                                 # Butuh libreyolo >= 1.6 (1.5 jatuh ke eager dengan peringatan).
  fast_preprocess: false         # hanya untuk frame >= 640x640; video demo 848x478.
  share_across_cameras: true
  batch_inference: false         # 1 kamera: tidak ada yang di-batch.
  max_batch: 8
  batch_wait_ms: 4.0

tracker:
  backend: "iou"
  track_threshold: 0.45
  match_threshold: 0.8
  track_buffer_seconds: 1.0
